[tool.pytest.ini_options]
testpaths = ["humanoid/tests", "reconstruction/tests", "video_g1/tests"]
norecursedirs = [".git", ".venv*", "third_party", "runs", "native/build", ".cache"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["third_party", "native/build", "runs", ".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
