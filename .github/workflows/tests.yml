name: Pipeline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: humanoid/requirements.lock.txt
      - run: python -m pip install -r humanoid/requirements.lock.txt
      - run: python -m pip install ruff==0.17.3
      - run: ruff check video_g1 humanoid reconstruction scripts
      - run: ruff format --check video_g1 humanoid reconstruction scripts
      - run: python -m pytest -q
      - name: Install setup tool
        run: python -m pip install uv==0.13.0
      - name: Fetch pinned robot assets and prepare CPU runtime
        run: make setup
      - name: Execute complete physical sequence and verify replay
        run: make video OUTPUT=runs/ci-video
  scene:
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.0
      - name: Install native CPU vision libraries
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libgl1
      - name: Install pinned CPU perception runtime and models
        run: make setup-scene
      - name: Verify CPU registration, exclusion and TSDF integration
        run: .venv-scene/bin/python -m pytest reconstruction/tests/test_fusion_geometry.py -q
      - name: Check real hand evidence using the supplied recording
        run: .venv-scene/bin/python -m reconstruction.scene_check data/book5/video.mp4 --mode gesture --output runs/ci-hands
      - name: Verify the input gate passed
        run: .venv-scene/bin/python -c "import json; assert json.load(open('runs/ci-hands/report.json'))['status'] == 'pass'"
