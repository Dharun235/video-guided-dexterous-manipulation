name: G1 workflow tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: humanoid/requirements.lock.txt
      - run: python -m pip install -r humanoid/requirements.lock.txt
      - run: python -m pytest -q humanoid/tests
