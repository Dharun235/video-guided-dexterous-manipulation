name: Pipeline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: humanoid/requirements.lock.txt
      - run: python -m pip install -r humanoid/requirements.lock.txt
      - run: python -m pip install ruff==0.17.3
      - run: ruff check video_g1 scripts/gpu/check_commands.py scripts/setup_rh56_eval.py
      - run: ruff format --check video_g1 scripts/gpu/check_commands.py scripts/setup_rh56_eval.py
      - run: python -m pytest -q
